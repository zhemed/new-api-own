name: trellis-gate

# Trellis 强制闸门 · 第三层（远程兜底）
#
# 本地 git hook 可以被 `git commit --no-verify` 绕过；这个工作流在 GitHub 上再核对一遍：
# 凡改动非 .trellis/ 文件的提交，消息里必须有 [task:<slug>]，否则这次运行直接失败（红叉）。
# 审计脚本与本地自检用的是同一个：scripts/check-trellis-gate.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Trellis task anchors
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史（审计需要起点之后的每个提交）
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: 审计提交是否都绑定了 Trellis 任务
        run: ./scripts/check-trellis-gate.sh --audit-only
