# New-API Docker Compose Configuration (host network mode)
#
# Host network deployment (mirrors the setup on 10.0.0.22):
#   - new-api / postgres / redis all use host networking
#   - Databases listen on 127.0.0.1 only, NOT exposed to LAN
#   - Access: http://<server-ip>:3000
#
# Uses our own image: ghcr.io/zhemed/new-api-own:latest
#
# IMPORTANT: change all default passwords (123456) before production!

services:
  new-api:
    image: ghcr.io/zhemed/new-api-own:latest
    pull_policy: always
    container_name: new-api
    restart: always
    network_mode: host
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@127.0.0.1:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@127.0.0.1:6379
      - TZ=Asia/Shanghai
      - CRITICAL_RATE_LIMIT_ENABLE=false
      - LOGIN_SESSION_NEVER_EXPIRES=true
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    network_mode: host
    command: ["redis-server", "--requirepass", "123456", "--bind", "127.0.0.1", "::1"]

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
