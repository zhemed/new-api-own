# Docker 环境标准：Docker 29.7.2 + Compose v5.4.0（一键安装见 install-docker.sh）
# New-API Docker Compose Configuration (host network mode)
#
# Host network deployment (self-hosted internal setup):
#   - new-api / postgres / redis all use host networking
#   - Databases listen on 127.0.0.1 only, NOT exposed to LAN
#   - Access: http://<server-ip>:3000
#
# Uses our own image: ghcr.io/zhemed/new-api-own:${NEW_API_IMAGE_TAG:-latest}
#
# File name: `compose.yaml` is Compose v2's **preferred** name. Measured precedence when
# several coexist (compose 5.4.0): compose.yaml > compose.yml > docker-compose.yml >
# docker-compose.yaml, and compose warns about the duplicates. Keep this file as
# compose.yaml; the legacy names are only accepted for pre-existing deployments
# (install-compose.sh refuses to leave two names side by side).
#
# One-command deployment (install-compose.sh) copies this file into the project directory
# and writes a .env next to it. POSTGRES_PASSWORD / REDIS_PASSWORD are **required** -
# there is deliberately no fallback: a missing .env must fail loudly rather than silently
# boot a database superuser with a well-known password. So `docker compose up -d` in a
# bare clone now fails until you create a .env:
#   printf 'POSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env
#
# SECURITY - host networking puts the panel on every interface.
#   new-api listens on *:3000, so http://<public-ip>:3000/ is reachable from the
#   internet unless the host firewall blocks it; a reverse proxy in front does NOT
#   close that direct port. /api/status also answers without authentication, so an
#   exposed panel leaks configuration. Minimal hardening (keep host networking):
#     nft add table ip filter
#     nft add chain ip filter INPUT '{ type filter hook input priority filter; policy accept; }'
#     nft add rule ip filter INPUT iif lo accept
#     nft add rule ip filter INPUT tcp dport 3000 drop
#   To bind loopback only, drop `network_mode: host` for new-api and use
#     ports: ["127.0.0.1:3000:3000"]
#   (redis/postgres must then move off host networking as well).
#   Data files hold plaintext upstream API keys - keep them root-only:
#     chmod 700 data data/logs && chmod 600 data/*.db data/logs/*
#   See the "部署安全基线" section in MAINTENANCE.md.

services:
  new-api:
    image: ghcr.io/zhemed/new-api-own:${NEW_API_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${NEW_API_CONTAINER_NAME:-new-api}
    # unless-stopped: 崩溃与升级兜底会被拉起，但尊重运维的一次 docker stop
    # （always 会在 dockerd/宿主重启后把手工停掉的容器又拉起来，是惊吓不是健壮）。
    restart: unless-stopped
    network_mode: host
    command: --log-dir /app/logs
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先创建 .env}@127.0.0.1:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先创建 .env}@127.0.0.1:6379
      - TZ=Asia/Shanghai
      # Rate limiters are intentionally off for this self-hosted deployment
      # (trusted network). Set any of them to true to restore that limiter.
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=false
      - GLOBAL_API_RATE_LIMIT_ENABLE=false
      - CRITICAL_RATE_LIMIT_ENABLE=false
      - SEARCH_RATE_LIMIT_ENABLE=false
      - LOGIN_SESSION_NEVER_EXPIRES=true
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    # 等依赖真正 ready 再起应用，而不是让应用自己硬扛重试
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # 钉主版本：`redis:latest` 会跨大版本浮动，RDB/AOF 与命令行为都可能变；
    # `redis:7` 跟随 7.x 补丁流，是这个场景正确的粒度。
    image: redis:7
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先创建 .env}", "--bind", "127.0.0.1", "::1"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # 刻意只钉主版本：`postgres:15` 跟随 15.x 补丁流，Postgres 的小版本升级按设计
    # 兼容且带安全修复；钉到某个 15.x 反而会放弃补丁。
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先创建 .env}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
